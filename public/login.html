<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sports Cards Tracker: sign in</title>
<style>
body{margin:0;background:#f5f7fb;color:#0b1f44;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
form{background:#fff;border:1px solid #e1e6ef;border-radius:12px;padding:28px;width:min(360px,90vw)}
h1{display:flex;align-items:center;gap:10px;font-size:20px;margin:0 0 6px}
h1 i{width:11px;height:11px;background:#e0303a;border-radius:2px;display:inline-block}
p{color:#6b7690;font-size:14px;margin:0 0 18px}
input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #e1e6ef;border-radius:8px;font-size:15px;margin-bottom:12px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:#0b1f44;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.err{color:#c0262d;font-size:13px;margin:0 0 10px;display:none}
</style></head><body>
<form method="post" action="/api/login">
<h1><i></i>Sports Cards Tracker</h1>
<p>Enter the password to view the report.</p>
<p class="err" id="err">That password didn't match.</p>
<input type="password" name="password" placeholder="Password" autofocus required>
<button type="submit">Sign in</button>
</form>
<script>if(location.search.indexOf('e=1')>-1)document.getElementById('err').style.display='block';</script>
</body></html>
